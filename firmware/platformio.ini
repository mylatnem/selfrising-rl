; ============================================================
;  SelfRising RL · ESP32 固件（PlatformIO）
;
;  用法：
;    pio run                 # 只编译
;    pio run -t upload       # 编译并烧录
;    pio device monitor      # 看串口输出
;
;  说明：策略文件 include/policy.h 由 tools/export_policy.py 生成，
;        仓库里给的是全零占位版本（能编译、不会动）。
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; 舵机与 IMU
lib_deps =
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    madhephaestus/ESP32Servo @ ^3.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O2

; 串口打印（DRY_RUN=1 时不动舵机，只打印观测与动作）
build_unflags =
